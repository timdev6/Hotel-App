name: csc322_starter_app
description: "CSCI 3220 Mobile App Starter App"
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.1+1

# -----------------------------------------------------------------------
# Allowed Flutter SDK Versions
# -----------------------------------------------------------------------
environment:
  sdk: ^3.13.0

# -----------------------------------------------------------------------
# Dependencies
# -----------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter
  
  loading_animation_widget: ^1.3.0
  flutter_secure_storage: ^9.2.4
  permission_handler: ^12.0.1
  firebase_storage: ^13.6.0
  flutter_riverpod: ^3.4.3
  cloud_firestore: ^6.10.2
  cupertino_icons: ^2.0.0
  firebase_core: ^4.15.2
  auto_size_text: ^3.0.0
  path_provider: ^2.1.5
  firebase_auth: ^6.7.0
  image_picker: ^1.2.0
  go_router: ^16.2.4
  lottie: ^3.3.2
  logger: ^2.6.2
  intl: ^0.20.2
  firebase_app_check: ^0.4.9

# -----------------------------------------------------------------------
# Dev Dependencies
# -----------------------------------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# -----------------------------------------------------------------------
# Icon Displayed in OS
# -----------------------------------------------------------------------
flutter_launcher_icons:
  image_path_android: "images/logo.png"
  image_path_ios: "images/logo.png"
  android: true
  ios: true
  remove_alpha_ios: true

# -----------------------------------------------------------------------
# Flutter Settings
# -----------------------------------------------------------------------
flutter:
  uses-material-design: true
  assets:
    - images/
    - animations/
    # - assets/
